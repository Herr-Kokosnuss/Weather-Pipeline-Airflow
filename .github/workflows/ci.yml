name: Weather ML App CI/CD

on:
  push:
    branches: [ main, deployment, frontend-update, deployment-cloud ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Enable manual triggering

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_BASE: ${{ secrets.ECR_BASE_URL }}
  ECR_ML: ${{ secrets.ECR_BASE_URL }}/${{ secrets.ECR_ML_REPO }}
  ECR_API: ${{ secrets.ECR_BASE_URL }}/${{ secrets.ECR_API_REPO }}
  ECR_FRONTEND: ${{ secrets.ECR_BASE_URL }}/${{ secrets.ECR_FRONTEND_REPO }}
  ECR_CONFIG: ${{ secrets.ECR_BASE_URL }}/${{ secrets.ECR_CONFIG_REPO }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas httpx fastapi requests pydantic
        
    - name: Run API tests
      run: |
        python -m pytest tests/test_api.py -v
        
    - name: Run Utils tests
      run: |
        python -m pytest tests/test_utils.py -v
        
    - name: Run Model tests
      run: |
        python -m pytest tests/test_model.py -v

  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Config image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Build and push Config image
        docker build -t ${{ env.ECR_CONFIG }}:latest -f Dockerfile.config .
        docker push ${{ env.ECR_CONFIG }}:latest
        docker tag ${{ env.ECR_CONFIG }}:latest ${{ env.ECR_CONFIG }}:${{ github.sha }}
        docker push ${{ env.ECR_CONFIG }}:${{ github.sha }}

    - name: Build and push ML image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Build and push ML image
        docker build -t ${{ env.ECR_ML }}:latest -f Dockerfile .
        docker push ${{ env.ECR_ML }}:latest
        docker tag ${{ env.ECR_ML }}:latest ${{ env.ECR_ML }}:${{ github.sha }}
        docker push ${{ env.ECR_ML }}:${{ github.sha }}

    - name: Build and push API image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Build and push API image
        docker build -t ${{ env.ECR_API }}:latest -f Dockerfile.api .
        docker push ${{ env.ECR_API }}:latest
        docker tag ${{ env.ECR_API }}:latest ${{ env.ECR_API }}:${{ github.sha }}
        docker push ${{ env.ECR_API }}:${{ github.sha }}

    - name: Build and push Frontend image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Build and push Frontend image
        docker build -t ${{ env.ECR_FRONTEND }}:latest -f Dockerfile.frontend .
        docker push ${{ env.ECR_FRONTEND }}:latest
        docker tag ${{ env.ECR_FRONTEND }}:latest ${{ env.ECR_FRONTEND }}:${{ github.sha }}
        docker push ${{ env.ECR_FRONTEND }}:${{ github.sha }}