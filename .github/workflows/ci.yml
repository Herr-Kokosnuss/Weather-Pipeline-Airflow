name: Weather ML App CI/CD

on:
  push:
    branches: [ main, deployment, frontend-update ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Enable manual triggering

env:
  AWS_REGION: us-east-1
  ECR_BASE: 730335255832.dkr.ecr.us-east-1.amazonaws.com
  ECR_ML: 730335255832.dkr.ecr.us-east-1.amazonaws.com/weather
  ECR_API: 730335255832.dkr.ecr.us-east-1.amazonaws.com/weather-api
  ECR_FRONTEND: 730335255832.dkr.ecr.us-east-1.amazonaws.com/weather-frontend
  S3_BUCKET: weather-prediction-airflow-2580  # Updated with your actual bucket name

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas httpx fastapi requests pydantic
        
    - name: Run API tests
      run: |
        python -m pytest tests/test_api.py -v
        
    - name: Run Utils tests
      run: |
        python -m pytest tests/test_utils.py -v
        
    - name: Run Model tests
      run: |
        python -m pytest tests/test_model.py -v

  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Create deployment package
      run: |
        # Create deployment directory
        mkdir -p deployment
        
        # Copy necessary files
        cp docker-compose.yml deployment/
        
        # Copy directories if they exist
        [ -d "dags" ] && cp -r dags deployment/
        [ -d "scripts" ] && cp -r scripts deployment/
        [ -d "models" ] && cp -r models deployment/
        [ -d "data" ] && cp -r data deployment/
        [ -d "api" ] && cp -r api deployment/
        [ -d "frontend" ] && cp -r frontend deployment/
        
        # Copy Dockerfiles and requirements
        cp Dockerfile* deployment/
        cp requirements.txt deployment/
        
        # Create setup script
        cat > deployment/setup.sh << 'EOF'
        #!/bin/bash
        
        # Pull images from ECR
        aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_BASE}
        docker pull ${ECR_ML}:latest
        docker pull ${ECR_API}:latest
        docker pull ${ECR_FRONTEND}:latest
        
        # Start services
        docker-compose up -d
        EOF
        
        chmod +x deployment/setup.sh
        
        # Create tar file
        tar -czf deployment.tar.gz deployment/

    - name: Upload deployment package to S3
      run: |
        aws s3 cp deployment.tar.gz s3://${{ env.S3_BUCKET }}/deployment-${{ github.sha }}.tar.gz

    - name: Build and push ML image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Build and push ML image
        docker build -t ${{ env.ECR_ML }}:latest -f Dockerfile .
        docker push ${{ env.ECR_ML }}:latest
        docker tag ${{ env.ECR_ML }}:latest ${{ env.ECR_ML }}:${{ github.sha }}
        docker push ${{ env.ECR_ML }}:${{ github.sha }}

    - name: Build and push API image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Build and push API image
        docker build -t ${{ env.ECR_API }}:latest -f Dockerfile.api .
        docker push ${{ env.ECR_API }}:latest
        docker tag ${{ env.ECR_API }}:latest ${{ env.ECR_API }}:${{ github.sha }}
        docker push ${{ env.ECR_API }}:${{ github.sha }}

    - name: Build and push Frontend image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Build and push Frontend image
        docker build -t ${{ env.ECR_FRONTEND }}:latest -f Dockerfile.frontend .
        docker push ${{ env.ECR_FRONTEND }}:latest
        docker tag ${{ env.ECR_FRONTEND }}:latest ${{ env.ECR_FRONTEND }}:${{ github.sha }}
        docker push ${{ env.ECR_FRONTEND }}:${{ github.sha }} 