name: Weather ML App CI/CD

on:
  push:
    branches: [ main, deployment ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Enable manual triggering

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: weather-ml-airflow-dev
  ECR_URI: 730335255832.dkr.ecr.us-east-1.amazonaws.com/weather-ml-airflow-dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas httpx fastapi requests pydantic
        
    - name: Run API tests
      run: |
        python -m pytest tests/test_api.py -v
        
    - name: Run Utils tests
      run: |
        python -m pytest tests/test_utils.py -v

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Build and push image
        docker build -t ${{ env.ECR_URI }}:latest .
        docker push ${{ env.ECR_URI }}:latest
        
        # Tag with commit SHA for versioning
        docker tag ${{ env.ECR_URI }}:latest ${{ env.ECR_URI }}:${{ github.sha }}
        docker push ${{ env.ECR_URI }}:${{ github.sha }} 